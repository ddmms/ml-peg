# Descriptions for the generated model list in models.rst. Every class_name used in
# ml_peg/models/models.yml must belong to a family here, or the docs build fails.
# Families are documented in the order they are defined below.

families:
  MACE:
    class_names: [mace, mace_mp, mace_off, mace_omol, mace_polar, MACECalculator]

  DPA:
    class_names: [DP]
    notes: |
      Install these fixed-float32 DeePMD checkpoints with ``uv sync --extra dpa``.
      DPA-3.3-1M uses OpenLAM-v1 with the OMat24 head and the DPA4 variants use
      OMat24. DPA-3.3-1M is CC-BY-4.0, while DPA4 is CC-BY-NC-4.0 and restricted
      to non-commercial use.

  Orb:
    class_names: [ORBCalculator]

  PET:
    class_names: [UPETCalculator]

  UMA (FairChem):
    class_names: [FAIRChemCalculator]

  MatterSim:
    class_names: [MatterSimCalculator]

  GRACE:
    class_names: [grace_fm]

  SevenNet:
    class_names: [SevenNetCalculator]

  TACE:
    class_names: [TACEAseCalc]
    notes: |
      `Model documentation <https://tace.readthedocs.io/en/latest/guide/foundation.html>`_.
      Model weights are licensed under CC BY 4.0.

  Vivace:
    class_names: [MLFFCalculator]

  AIMNet2:
    class_names: [AIMNet2ASE]
    notes: |
      .. TODO: switch to ``--extra aimnet`` once an aimnet release after 0.2.0 includes
         aimnetcentral PR #127 (see the aimnet entry in pyproject.toml
         [dependency-groups]).

      Install these models (MIT licence) with ``uv sync --group aimnet``. Installing
      with pip is not currently supported: the AIMNet2 calculator fix for reused
      calculators silently dropping neighbours is not yet in a PyPI release of
      ``aimnet``, so ML-PEG pins it to a git commit that only uv applies.
      Both models evaluate their network in float32, with energies accumulated in
      float64 (full float64 evaluation is not supported). They include their own
      DFT-D3 correction, and cover H, B, C, N, O, F, Si, P, S, Cl, As, Se, Br and
      I. They are closed-shell models: ``atoms.info["charge"]`` is used, but spin
      multiplicity is ignored. Periodic systems automatically use DSF long-range
      Coulomb by default, though note that "All models were trained on isolated
      molecules and molecular clusters. They are not parameterized for bulk materials,
      extended surfaces, or metallic systems." See the AIMNet2
      `model documentation <https://isayevlab.github.io/aimnetcentral/models/guide/>`__.

      Each AIMNet2 model is released as an ensemble of four independently trained
      members. ML-PEG benchmarks **only member 0 by default**, not the ensemble
      average. This matches the aimnetcentral default: the ``aimnet2`` and
      ``aimnet2-2025`` aliases resolve to ``aimnet2-wb97m-d3_0`` and
      ``aimnet2-b973c-2025-d3_0`` respectively, and the
      `model selection guide <https://isayevlab.github.io/aimnetcentral/models/guide/>`_
      recommends a single member for production use, (all members have very similar
      accuracy on average). aimnetcentral does not provide an ensemble-averaging
      calculator. To benchmark a different member, set ``kwargs.model`` to its full
      name, e.g. ``aimnet2-wb97m-d3_2`` (``_0`` to ``_3`` are valid).

      Both training sets are public (MIT licence). ``AIMNet2`` is the original set of
      about 20M molecular structures, released in two versions (ωB97M/def2-TZVPP for
      ``aimnet2`` and B97-3c), `doi:10.1184/R1/27629937.v2
      <https://doi.org/10.1184/R1/27629937.v2>`_. ``AIMNet2-2025`` is a continually
      pretrained version of the AIMNet2(2023) model (trained on the B97-3c version of
      the ``AIMNet2`` dataset), trained with an additional 3.8M structures at B97-3c
      focused on non-covalent interactions,
      `doi:10.1184/R1/31141138.v1 <https://doi.org/10.1184/R1/31141138.v1>`_.

  AceFF:
    class_names: [TMDNETCalculator]
    notes: |
      Install with ``uv sync --extra aceff``. AceFF runs through TorchMD-Net's
      ``TMDNETCalculator``, which always passes float32 inputs to the model, so both
      ``low`` and ``high`` precision run in float32 (the model itself also supports
      float64), and ``overwrite_dtype`` has no effect. The checkpoint is downloaded
      from Hugging Face at the pinned ``revision``. Structures without
      ``atoms.info["charge"]`` are evaluated as neutral. The model includes its own
      dispersion correction, and covers H, B, C, N, O, F, Si, P, S, Cl, Br and I.

models:
  aceff-2p0: |
    AceFF-2.0, described in *AceFF: A State-of-the-Art Machine Learning Potential
    for Small Molecules*, `arXiv:2601.00581 <https://arxiv.org/abs/2601.00581>`_.
  aimnet2: |
    Described in Anstine, Zubatyuk and Isayev, *Chem. Sci.*, 2025, **16**,
    10228–10244, `doi:10.1039/d4sc08572h <https://doi.org/10.1039/d4sc08572h>`_.
  aimnet2-2025: |
    Described in Nayal, Cho and Isayev, *Mach. Learn.: Sci. Technol.*, 2026,
    **7**, 055033,
    `doi:10.1088/2632-2153/aea39f <https://doi.org/10.1088/2632-2153/aea39f>`_.
  tace-oam-7m: TACE-OAM-7M (M).
  tece-oam-rra-1p0: TECE-OAM-RRA-1.0 (XL).
  tace-oam-l: TACE-OAM-L (L).
