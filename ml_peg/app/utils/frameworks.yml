mlip_arena:
  label: MLIP Arena
  type: framework
  color: "#0f766e"
  text_color: "#ecfeff"
  url: "https://huggingface.co/spaces/atomind/mlip-arena"
  logo: "https://huggingface.co/front/assets/huggingface_logo-noborder.svg"
  description: "A benchmark platform evaluating foundation MLIPs on physical soundness and real-world utility (physics awareness, chemical reactivity, stability under extreme conditions, and thermodynamic prediction) rather than error metrics tied to a specific DFT reference, and agnostic to model architecture and training data."
  project_url: "https://huggingface.co/spaces/atomind/mlip-arena"
  paper_url: "https://proceedings.neurips.cc/paper_files/paper/2025/hash/bfa45223cc236855dbaa5c468c809896-Abstract-Datasets_and_Benchmarks_Track.html"
  github: "https://github.com/atomind-ai/mlip-arena"

mlip_audit:
  label: MLIP Audit
  type: framework
  color: "#1d4ed8"
  text_color: "#ffffff"
  url: "https://github.com/instadeepai/mlipaudit"
  logo: "https://raw.githubusercontent.com/instadeepai/mlipaudit/mlpeg-migration/InstaDeep_Logo.png"
  description: "MLIPAudit is a Python library and app for benchmarking and validating Machine Learning Interatomic Potential (MLIP) models, in particular those based on the mlip library. It aims to cover a wide range of use cases and difficulties, providing users with a comprehensive overview of the performance of their models. It also provides the option to benchmark models of any origin (e.g., also those based on PyTorch) via the ASE calculator interface."
  project_url: "https://huggingface.co/spaces/InstaDeepAI/mlipaudit-leaderboard"
  paper_url: "https://arxiv.org/abs/2511.20487"
  github: "https://github.com/instadeepai/mlipaudit/"

