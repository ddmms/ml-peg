metrics:
  Formation Energy MAE:
    # Accuracy targets derived from Ghosh et al. reference energies
    # (doi:10.1007/s11669-006-9007-4):
    # DFT gaps are 7.887 meV/atom (D023-D022) and 31.850 meV/atom (D023-L12).
    # These are not DFT uncertainty estimates.
    good: 0.004
    bad: 0.03
    unit: eV/atom
    tooltip: "Mean absolute error of formation energies for all Al3Ti polymorphs compared to DFT"
    level_of_theory: GGA-PW91
  Relative Stability Ordering Accuracy:
    good: 100.0
    bad: 0.0
    unit: '%'
    tooltip: "Percentage of polymorph pairs whose predicted formation-energy ordering matches the DFT reference"
    level_of_theory: GGA-PW91
  Volume MAE:
    good: 0.25
    bad: 1.0
    unit: Å³/atom
    tooltip: "Mean absolute error of relaxed volume per atom across the three Al3Ti polymorphs compared to DFT"
    level_of_theory: GGA-PW91
  Lattice Parameter MAPE:
    good: 0.5
    bad: 2.0
    unit: '%'
    tooltip: "Mean absolute percentage error of relaxed lattice parameters, with equal weight per Al3Ti polymorph, compared to DFT"
    level_of_theory: GGA-PW91
