# Thresholds are set per family, because the two families differ in response
# magnitude by a factor of ~18. `bad` is the mean reference response of the
# column, so an MAE as large as the effect being predicted scores 0; a model
# that ignores the field predicts zero response and lands exactly there.
metrics:
  Total MAE:
    good: 0
    bad: 0.046
    unit: eV
    tooltip: "Mean Absolute Error for all systems"
    level_of_theory: wB97M-V
    weight: 0
  Alkanes MAE:
    good: 0
    bad: 0.005
    unit: eV
    tooltip: "Mean Absolute Error for Alkanes"
    level_of_theory: wB97M-V
    weight: 1
  Cumulenes MAE:
    good: 0
    bad: 0.087
