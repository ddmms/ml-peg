metrics:
  Density MAE (albite):
    good: 0.05
    bad: 0.30
    unit: g/cm³
    tooltip: >
      Mean absolute error of simulated vs experimental glass density for albite
      (NaAlSi3O8, g/cm3). Computed as the mean of per-replica absolute errors.
      Reference: 2.382 g/cm3 (Taylor & Brown, GCA 1979).
    level_of_theory: Experimental
    weight: 1.0
