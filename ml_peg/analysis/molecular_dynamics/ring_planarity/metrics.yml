metrics:
  Planarity Deviation:
    good: 0.0
    bad: 0.05
    unit: Å
    weight: 1
    tooltip: Mean RMSD of the ring atoms from their best-fit plane, averaged over the MD trajectory and across all molecules. NaN if any simulation failed or became unstable.
    level_of_theory: Experimental
  Planarity Deviation (stable only):
    good: 0.0
    bad: 0.05
    unit: Å
    weight: 0
    tooltip: As Planarity Deviation, but averaged only over the molecules whose simulations succeeded and remained stable.
    level_of_theory: Experimental
