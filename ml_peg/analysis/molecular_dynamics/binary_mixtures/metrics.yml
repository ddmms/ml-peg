# Thresholds from the power analysis in the input-generation repository,
# https://github.com/fjclark/ml-peg-liquid-mixtures-input-generation
# (data/power_analysis/thresholds.csv). good: the score of a model that matches
# experiment exactly, with one 0.2 + 1 ns run per box, plus 2 SD of its noise.
# bad: 5 x the score of Sage (openff-2.3.0, mean of 5 replicates). Mixture and
# pure densities share thresholds. Recompute them if the protocol changes.
metrics:
  ΔHmix MAE:
    good: 0.11
    bad: 2.9
    unit: kJ mol^-1
    tooltip: Mean absolute error of the enthalpy of mixing (30 points)
    level_of_theory: Experimental
    weight: 0
  ΔHmix MAZE:
    good: 0.82
    bad: 25.0
    unit: null
    tooltip: Mean absolute z-score of the enthalpy of mixing (30 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs
    level_of_theory: Experimental
  Density MAE:
    good: 0.0012
    bad: 0.047
    unit: g cm^-3
    tooltip: Mean absolute error of the mixture densities (27 points)
    level_of_theory: Experimental
    weight: 0
  Density MAZE:
    good: 1.2
    bad: 51.0
    unit: null
    tooltip: Mean absolute z-score of the mixture densities (27 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs
    level_of_theory: Experimental
  V^E MAE:
    good: 0.13
    bad: 1.2
    unit: cm^3 mol^-1
    tooltip: Mean absolute error of the excess molar volume (27 points)
    level_of_theory: Experimental
    weight: 0
  V^E MAZE:
    good: 0.97
    bad: 9.3
    unit: null
    tooltip: Mean absolute z-score of the excess molar volume (27 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs
    level_of_theory: Experimental
  Pure density MAE:
    good: 0.0012
    bad: 0.047
    unit: g cm^-3
    tooltip: Mean absolute error of the pure-liquid densities not already scored by
      the liquid densities benchmark (7 points)
    level_of_theory: Experimental
    weight: 0
  Pure density MAZE:
    good: 1.2
    bad: 51.0
    unit: null
    tooltip: Mean absolute z-score of the pure-liquid densities not already scored
      by the liquid densities benchmark (7 points), dividing each error by a fixed
      sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of 5 independent Sage runs
    level_of_theory: Experimental
  Flagged boxes:
    good: 0
    bad: 10
    unit: null
    tooltip: Number of the 50 boxes with a convergence, sampling, bonding or demixing
      flag, or a missing run (not scored)
    level_of_theory: null
    weight: 0
