# Thresholds from the power analysis in the input-generation repository,
# https://github.com/fjclark/ml-peg-liquid-mixtures-input-generation
# (data/power_analysis/thresholds.csv). good: the score of a model that matches
# experiment exactly, with one 0.2 + 1 ns run per box, plus 2 SD of its noise.
# bad: 5 x the score of Sage (openff-2.3.0, mean of 5 replicates). Mixture and
# pure densities share thresholds. All density metrics have weight 0: the liquid
# densities benchmark already scores most of the pure liquids, and mixture
# density errors are mostly pure-density errors. Recompute the thresholds if the
# protocol changes.
metrics:
  ΔHmix MAE:
    good: 0.097
    bad: 3.5
    unit: kJ mol^-1
    tooltip: Mean absolute error of the enthalpy of mixing (30 points)
    level_of_theory: Experimental
    weight: 0
  ΔHmix MAZE:
    good: 0.93
    bad: 39.0
    unit: null
    tooltip: Mean absolute z-score of the enthalpy of mixing (30 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs
    level_of_theory: Experimental
  Density MAE:
    good: 0.001
    bad: 0.064
    unit: g cm^-3
    tooltip: Mean absolute error of the mixture densities (27 points)
    level_of_theory: Experimental
    weight: 0
  Density MAZE:
    good: 1.1
    bad: 70.0
    unit: null
    tooltip: Mean absolute z-score of the mixture densities (27 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs (weight 0)
    level_of_theory: Experimental
    weight: 0
  V^E MAE:
    good: 0.11
    bad: 1.6
    unit: cm^3 mol^-1
    tooltip: Mean absolute error of the excess molar volume (27 points)
    level_of_theory: Experimental
    weight: 0
  V^E MAZE:
    good: 1.1
    bad: 17.0
    unit: null
    tooltip: Mean absolute z-score of the excess molar volume (27 points), dividing
      each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the spread of
      5 independent Sage runs
    level_of_theory: Experimental
  Pure density MAE:
    good: 0.001
    bad: 0.064
    unit: g cm^-3
    tooltip: Mean absolute error of the pure-liquid densities (19 points)
    level_of_theory: Experimental
    weight: 0
  Pure density MAZE:
    good: 1.1
    bad: 70.0
    unit: null
    tooltip: Mean absolute z-score of the pure-liquid densities (19 points),
      dividing each error by a fixed sqrt(σ_exp² + σ_Sage²), where σ_Sage is the
      spread of 5 independent Sage runs (weight 0, as the liquid densities
      benchmark scores most of these liquids)
    level_of_theory: Experimental
    weight: 0
  Flagged boxes:
    good: 0
    bad: 10
    unit: null
    tooltip: Number of the 49 boxes with a convergence, sampling, bonding or demixing
      flag, or a missing run (not scored)
    level_of_theory: null
    weight: 0
