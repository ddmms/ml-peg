metrics:
  Diffusion coefficient error:
    good: 10.0
    bad: 50.0
    unit: "%"
    tooltip: >-
      Absolute mean relative error across temperatures per element.
    level_of_theory: Experimental
  Temperature slope error:
    good: 20.0
    bad: 50.0
    unit: "%"
    tooltip: >-
      Absolute difference between predicted and experimental linear D(T) slopes,
      divided by the absolute experimental slope.
    level_of_theory: Experimental
