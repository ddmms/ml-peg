metrics:
  # good: 2.0 meV/atom is the reference uncertainty. wB97M-V/def2-TZVPD, the OMol25
  # level of theory, itself scores 1.98 against this reference at these 95
  # structures, so a model reproducing that level perfectly sits here. bad: 13.8
  # meV/atom is what a model that knows nothing scores -- one giving every
  # structure of a molecule the same energy -- which is the spread of the
  # reference's own relative energies. A model there has captured none of the
  # energy differences.
  Energy RMSE:
    good: 2.0
    bad: 13.8
    unit: meV/atom
    tooltip: "Energy error at the 95 DFT minima and transition states, each method measured from its own per-molecule mean so a constant offset cancels. ωB97M-V/def2-TZVPD, the OMol25 level of theory, itself scores 2.0 here: the reference uncertainty."
    level_of_theory: ωB97X/6-31G(d)
  # Not scored, so good and bad only colour the column. The reference geometries
  # were optimised at ωB97X/6-31G(d) and are not stationary at other levels of
  # theory: wB97M-V/def2-TZVPD, the OMol25 level, itself has an RMS force of 128.9
  # meV/Å at them, so the number mostly measures the gap between the two levels.
  # good: that measured gap. bad: 153 meV/Å, the RMS of the DFT forces along the
  # paths -- a residual force that large means the model does not see these
  # structures as stationary at all.
  Force RMSE:
    good: 129.0
    bad: 153.0
    unit: meV/Å
    weight: 0
    tooltip: "Force error at the 95 DFT minima and transition states, where DFT's force is zero, so this is the RMS of the model's own force over every component. Not scored: these are ωB97X/6-31G(d) geometries, and ωB97M-V/def2-TZVPD, the OMol25 level of theory, itself feels an RMS force of 129 meV/Å at them, so this mostly measures the gap between the two levels."
    level_of_theory: ωB97X/6-31G(d)
  # Same basis as Energy RMSE. good: 1.5 meV/atom, what wB97M-V/def2-TZVPD scores
  # on a 300-frame sample of the paths (1.51). bad: the know-nothing level over the
  # 11,173 path frames, 11.6 meV/atom. Not scored: it tracks Energy RMSE almost
  # exactly (Pearson 1.00 over the models measured), so scoring both would count
  # it twice.
  Path energy RMSE:
    good: 1.5
    bad: 11.6
    unit: meV/atom
    weight: 0
    tooltip: "The same energy error along the 11,173 steepest-descent frames joining the stationary points: the shape of the surface between them. Not scored: it tracks Energy RMSE almost exactly, so scoring both would count it twice."
    level_of_theory: ωB97X/6-31G(d)
  # Not scored, for both reasons above: it tracks Force RMSE almost exactly, and
  # the same level-of-theory gap dominates it. good: 123 meV/Å, what
  # wB97M-V/def2-TZVPD scores on a 300-frame sample of the paths. bad: 153 meV/Å,
  # what predicting zero force everywhere scores -- no skill.
  Path force RMSE:
    good: 123.0
    bad: 153.0
    unit: meV/Å
    weight: 0
    tooltip: "Force error along the paths, where DFT forces are non-zero. Not scored: it tracks Force RMSE almost exactly, and the same gap between levels of theory dominates it: ωB97M-V/def2-TZVPD itself scores 123 meV/Å here."
    level_of_theory: ωB97X/6-31G(d)
  # The four drift metrics share their thresholds. bad: 0.34 Å separates the
  # closest two distinct reference minima (paracetamol 2 and 3); past it, a
  # structure that drifted cannot be told from one that landed on another minimum,
  # and most minima here have another within 0.5 Å. good: 0.01 Å, about the
  # run-to-run noise of the saddle search on GPU, which also leaves room for the
  # small geometry differences between DFT functionals.
  Reconverged minima RMSD (median):
    good: 0.01
    bad: 0.34
    unit: Å
    tooltip: "RMSD between each reference minimum and where it ends up when relaxed under the model. The closest two distinct reference minima are 0.34 Å apart, so by then it may be a different conformer."
    level_of_theory: ωB97X/6-31G(d)
  Reconverged minima RMSD (90th pct):
    good: 0.01
    bad: 0.34
    unit: Å
    tooltip: "90th percentile of the same distribution, distinguishing a model that holds most minima well but loses a few from one that is uniformly imprecise."
    level_of_theory: ωB97X/6-31G(d)
  Saddles converged:
    good: 0.95
    bad: 0.3
    unit: fraction
    tooltip: "Fraction of all 67 reference transition states where eigenvector following reaches a saddle within the step budget."
    level_of_theory: ωB97X/6-31G(d)
  Reconverged saddle RMSD (median):
    good: 0.01
    bad: 0.34
    unit: Å
    tooltip: "RMSD between each reference transition state and where it reconverges to, over those the search reached."
    level_of_theory: ωB97X/6-31G(d)
  Reconverged saddle RMSD (90th pct):
    good: 0.01
    bad: 0.34
    unit: Å
    tooltip: "90th percentile of the same distribution. Saddles that never converge are left out here and counted by Saddles converged; the step budget truncates the far-drifting tail, so this understates it."
    level_of_theory: ωB97X/6-31G(d)
  Connectivity preserved:
    good: 0.9
    bad: 0.4
    unit: fraction
    tooltip: "Fraction of all 67 reference transition states whose steepest-descent paths reach the same two minima as DFT. A saddle can sit in the right place and still rewire the network."
    level_of_theory: ωB97X/6-31G(d)
  Normal mode overlap:
    good: 0.99
    bad: 0.8
    unit: cosine
    tooltip: "Agreement with the DFT normal modes at the reference geometries, matched one to one after projecting out translation and rotation."
    level_of_theory: ωB97X/6-31G(d)
  Reaction mode overlap:
    good: 0.99
    bad: 0.8
    unit: cosine
    tooltip: "Agreement with the DFT imaginary mode, over the saddles where the model has one at all. Read with Saddles converged."
    level_of_theory: ωB97X/6-31G(d)
  Stiffness error:
    good: 2.0
    bad: 20.0
    unit: "%"
    tooltip: "How far the model's overall stiffness is from DFT's, from the least-squares slope of model against DFT eigenvalues; median over structures. Weighted by eigenvalue, so it describes the stiff modes. Click for the signed values: negative is softer than DFT."
    level_of_theory: ωB97X/6-31G(d)
  Soft mode curvature error:
    good: 0.02
    bad: 0.2
    unit: eV/Å²
    tooltip: "Absolute eigenvalue error over the softest third of the modes, where a landscape lives. Absolute rather than relative because these eigenvalues approach zero."
    level_of_theory: ωB97X/6-31G(d)
  Reaction mode curvature:
    good: 1.0
    bad: 0.3
    unit: ratio
    tooltip: "The model's imaginary eigenvalue over DFT's, folded as min(r, 1/r) at each transition state, so a barrier top twice too sharp or twice too flat both read 0.5. Click for the unfolded ratios: above 1 is too sharp, below 1 too flat. Sets the tunnelling correction and the TST prefactor."
    level_of_theory: ωB97X/6-31G(d)

# Pending. Each of these moves into `metrics` above when its calculation lands
# in `calc_stationary_points.py`. Thresholds are kept here so the reasoning is
# not lost, not because they are settled.
#
# None of these binarise a distance. An earlier design counted a structure as
# "held" if it stayed within 0.3 A, which cut straight through a populated part
# of the measured distribution: on MACE-OFF the drifts run continuously from
# 0.010 to 0.303 A and only then jump to 0.458. One aspirin saddle was measured
# twice, 0.2991 and 0.3031 A, and the threshold put the two measurements of the
# same structure on opposite sides. Reporting the distribution instead removes
# that cliff. 0.3 A survives only inside the endpoint identification, where
# some cutoff is unavoidable.
#
# Median and 90th percentile are both reported, as in the landscape search: the
# median says where the typical structure sits, and the 90th percentile whether
# there is a tail of structures the model moved a long way. Both read directly
# in Å, where a mean would mix the bulk and the tail into one number.
#
#
# Mean first passage time between a chosen pair of minima, derived from the
# reconverged network and compared with the same quantity from the DFT
# landscape. This is the first metric here that tests the kinetics the
# landscape implies rather than its geometry, so a model can reproduce every
# structure and still fail it. Thresholds to be set once the spread across
# models is known: an order of magnitude is the obvious scale, but that should
# be justified rather than assumed.
#  MFPT error (log10):
#    good:
#    bad:
#    unit: log10 ratio
#    tooltip: ""
#    level_of_theory: ωB97X/6-31G(d)
