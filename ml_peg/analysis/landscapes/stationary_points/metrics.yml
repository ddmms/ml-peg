# Only the metrics that `analyse_stationary_points.py` actually produces are
# declared here. The rest of the benchmark -- reconvergence, connectivity and
# Hessians -- is held in the commented block at the bottom and moves up as each
# calculation lands, so this file never promises a number nothing computes.
metrics:
  Energy RMSE:
    good: 1.0
    bad: 10.0
    unit: meV/atom
    tooltip: "RMSE between MLIP and DFT energies at the Landscape17 minima and transition states, each method measured from its own mean so that an overall offset cancels. The mean rather than the lowest structure: a model that badly over-stabilises one structure would otherwise take that structure as its zero, measuring every other energy from its own worst error. Divided by atom count so the six molecules, 9 to 21 atoms, contribute on the same scale."
    level_of_theory: ωB97X/6-31G(d)
  Residual force (median):
    good: 10.0
    bad: 100.0
    unit: meV/Å
    tooltip: "Median of the largest force component the MLIP reports at the DFT stationary points. DFT forces are zero there by construction, so this is not an error against a reference but a measure of how far the DFT geometry is from being stationary under the model, which is what decides whether it survives reconvergence. The thresholds are the scale at which a geometry optimiser would consider a structure converged (good) and the scale at which it will certainly migrate (bad); they are provisional until the spread across models is known."
    level_of_theory: ωB97X/6-31G(d)
  Residual force (90th pct):
    good: 50.0
    bad: 500.0
    unit: meV/Å
    tooltip: "90th percentile of the same distribution, so a model that is uniformly good is distinguished from one that holds most of the landscape and is badly wrong about a tenth of it. The median cannot separate those two, and only the second loses structures under reconvergence. Thresholds are provisional, like the median's: good means nine structures in ten sit where an optimiser would call them converged, bad means one in ten sits where it will certainly migrate."
    level_of_theory: ωB97X/6-31G(d)
  Path energy RMSE:
    good: 1.0
    bad: 10.0
    unit: meV/atom
    tooltip: "The same quantity along the steepest-descent paths joining the stationary points. Thresholds match those for the stationary points so the two can be read against each other: the stationary points test the depths of the wells and the heights of the barriers, the paths test the shape of the surface in between."
    level_of_theory: ωB97X/6-31G(d)
  Path force RMSE:
    good: 10.0
    bad: 100.0
    unit: meV/Å
    tooltip: "RMSE between MLIP and DFT forces over all 11,173 path frames and every component. These are ordinary points on the surface with non-zero forces, so this is a conventional accuracy test -- but sampled along the reaction coordinates rather than from a thermal distribution."
    level_of_theory: ωB97X/6-31G(d)

