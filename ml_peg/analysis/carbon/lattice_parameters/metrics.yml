metrics:
  Lattice parameter MAPE:
    good: 0.2
    bad: 2.0
    unit: "%"
    tooltip: "Mean absolute percentage error in relaxed lattice parameters across the five periodic systems, excluding unconverged relaxations"
    level_of_theory: optB88-vdW
    weight: 1
  Bond length MAPE:
    good: 0.1
    bad: 1.0
    unit: "%"
    tooltip: "Mean absolute percentage error in first and second neighbour shell bond lengths for C60 and C100, excluding unconverged relaxations"
    level_of_theory: optB88-vdW
    weight: 1
  Energy above graphite MAE:
    good: 10.0
    bad: 100.0
    unit: "meV/atom"
    tooltip: "Mean absolute error in energy above graphite across the six non-graphite systems, excluding unconverged relaxations"
    level_of_theory: optB88-vdW
    weight: 1
  Convergence:
    good: 100.0
    bad: 99.0
    unit: "%"
    tooltip: "Percentage of relaxed structures that converged; unconverged structures are reported as NaN"
    level_of_theory: optB88-vdW
    weight: 1
