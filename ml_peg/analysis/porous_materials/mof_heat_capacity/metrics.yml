metrics:
  Cv MAE:
    good: 0.04
    bad: 0.1
    unit: J/g/K
    tooltip: >-
      Mean absolute error of the isochoric heat capacity at 300 K, from the
      phonon density of states, against experimental calorimetry. Thresholds
      are set from expected performance for this property rather than
      fitted to scored models, and should be revisited once more models
      have been run.
    weight: 1.0
    level_of_theory: Experimental

  Imaginary modes MAE:
    good: 0.0
    bad: 1.0
    unit: "%"
    tooltip: >-
      Percentage of phonon modes phonopy excludes from the thermal-property
      integration at zero cutoff frequency, q-point-weighted and averaged over
      frameworks. Every framework here has been synthesised, so the expected
      value is zero and the metric is the mean deviation from it.
    weight: 1.0
    level_of_theory: Experimental
