# Provisional thresholds, to be set once several models have been run.
metrics:
  Energy above hull MAE:
    good: 20.0
    bad: 100.0
    unit: meV/atom
    tooltip: "Mean absolute error in the energy above the hull of each binary, with the hull of each system built from the model energies"
    level_of_theory: PBE
  Stability F1:
    good: 1.0
    bad: 0.5
    unit: null
    tooltip: "F1 score for classifying binaries as stable (on the hull)"
    level_of_theory: PBE
  Failed systems:
    good: 0.0
    bad: 10.0
    unit: "%"
    tooltip: "Share of binary systems in which a calculation failed (including unsupported elements). These systems are left out of the other metrics"
    level_of_theory: PBE
  Formation energy MAE:
    good: 20.0
    bad: 100.0
    unit: meV/atom
    tooltip: "Mean absolute error in the formation energy of each binary, relative to the elemental ground states"
    level_of_theory: PBE
    weight: 0
  Formation energy RMSE:
    good: 30.0
    bad: 150.0
    unit: meV/atom
    tooltip: "Root-mean-square error in the formation energy of each binary"
    level_of_theory: PBE
    weight: 0
  Formation energy R²:
    good: 1.0
    bad: 0.9
    unit: null
    tooltip: "Coefficient of determination of the formation energies"
    level_of_theory: PBE
    weight: 0
